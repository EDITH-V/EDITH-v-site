{s:'TechCrunch',d:'24 Oct 2026',k:'Engine flaw',h:'Two PHP flaws let attackers in with no password',v:'7 days',to:7,suf:' days',l:'of attacks seen before patches',t:'Two flaws in the PHP engine let attackers run code on a server with no password. Amazon saw exploitation about a week before patches shipped, and banks, retailers and hospitals took sites offline to update.',u:'https://techcrunch.com/2026/10/24/php-ocalypse-how-two-critical-web-bugs-almost-broke-the-internet/',art:'shell',g:'#4a1226'},
{s:'TechCrunch',d:'27 Oct 2026',k:'Government alert',h:'CISA confirms the PHP flaws are under attack',v:'70%',to:70,suf:'%',l:'of web-facing servers reportedly run PHP',t:'CISA confirmed the PHP flaws are being exploited and ordered US civilian federal agencies to patch. PHP reportedly runs about 70% of web-facing servers.',u:'https://techcrunch.com/2026/10/27/us-government-says-hackers-are-now-exploiting-critical-php-web-bugs/',art:'gov',g:'#12305f'},
{s:'Notebookcheck',d:'25 Oct 2026',k:'Legacy versions',h:'Many servers run PHP with no official fix',v:'8.2–8.5',l:'the only versions with official fixes',t:'Official fixes cover only PHP 8.2 to 8.5. Scans still found hundreds of thousands of public hosts announcing PHP 5.x or 7.x, though distribution backports mean a version number alone can mislead.',u:'https://notebookcheck.net/PHP2Shell-leaves-millions-of-servers-on-PHP-versions-with-no-official-fix.1433676.0.html',art:'legacy',g:'#4a3410'},
{s:'Fortune',d:'21 Oct 2026',k:'AI-assisted discovery',h:'AI speeds up the race to exploit PHP bugs',v:'10+ yrs',to:10,suf:'+ yrs',l:'the vulnerable code went unnoticed',t:'The vulnerable code had sat in PHP for more than a decade. AI helped researchers turn the weaknesses into a working exploit, and AWS reported broad exploitation by 21 October.',u:'https://fortune.com/2026/10/21/ai-tools-discovered-the-php-vulnerability-that-could-take-down-70-of-the-internet-now-the-race-is-on-to-patch-it-before-ai-powered-hackers-attack/',art:'ai',g:'#2e1f5e'},
{s:'Help Net Security',d:'Jun 2024',k:'Ransomware',h:'PHP-CGI flaw used to deliver ransomware',v:'Days',l:'from disclosure to ransomware use',t:'A command injection flaw in PHP running in CGI mode on Windows was used by the TellYouThePass ransomware gang within days of disclosure.',u:'https://www.helpnetsecurity.com/?p=304146',art:'ransom',g:'#4a1226'},
{s:'SecurityWeek',d:'Jan 2024',k:'Botnet',h:'Botnet hunts Laravel secrets and old PHPUnit',v:'2017',l:'PHPUnit bug still being exploited',t:'CISA and the FBI warned of a botnet that scans for Laravel sites with exposed .env files and for a 2017 PHPUnit flaw, harvesting cloud credentials.',u:'https://www.securityweek.com/us-gov-issues-warning-for-androxgh0st-malware-attacks/amp/',art:'botnet',g:'#3a1030'},

{s:'Patchstack',d:'Feb 2026',k:'CMS plugins',h:'WordPress plugins drive the vulnerability surge',v:'5 hrs',to:5,suf:' hrs',l:'median time to mass exploitation',t:'The WordPress ecosystem logged 11,334 new vulnerabilities in 2025, up 42%, with 91% in plugins. Heavily targeted flaws saw mass exploitation after a median of five hours.',u:'https://patchstack.com/whitepaper/state-of-wordpress-security-in-2026/',art:'cms',g:'#12305f'}],
faq:[['How do I know if my PHP website is outdated?','If it runs on a PHP version that no longer receives security updates, or relies on unsupported frameworks and old dependencies, it may be exposed. PHP 8.1 reached end of life on 31 December 2025, and 8.2 follows on 31 December 2026. A security check shows exactly what needs attention.'],['What does the free website security check include?','A review of your PHP version, frameworks, dependencies and hosting setup, followed by a plain-language summary of the risks we find.'],['Can you upgrade my existing website instead of rebuilding it?','Often yes. We upgrade PHP versions and dependencies where practical, and recommend a rebuild only when a platform cannot be secured sustainably.'],['Will my website go offline during an upgrade?','We plan upgrades and testing carefully to keep disruption to your live website as low as possible.'],['Do you provide ongoing maintenance?','Yes. We offer ongoing maintenance and technical support to keep your website updated and secure.'],['How do your pricing packages work?','Each package covers a defined scope. Final pricing depends on project scope, complexity, and requirements.'],
['How do attackers actually break into PHP websites?','Recent incidents fall into four patterns. Flaws in PHP itself: the October 2026 <a href="https://techcrunch.com/2026/10/24/php-ocalypse-how-two-critical-web-bugs-almost-broke-the-internet/" target="_blank" rel="noopener">PHP2Shell bugs</a> allow code execution without a login, and a 2024 <a href="https://www.helpnetsecurity.com/?p=304146" target="_blank" rel="noopener">PHP-CGI flaw</a> was used to deliver ransomware. Forgotten dependencies: a <a href="https://www.securityweek.com/us-gov-issues-warning-for-androxgh0st-malware-attacks/amp/" target="_blank" rel="noopener">botnet</a> hunts for exposed Laravel .env files and an old PHPUnit bug. Plugins and extensions: <a href="https://patchstack.com/whitepaper/state-of-wordpress-security-in-2026/" target="_blank" rel="noopener">91% of new WordPress vulnerabilities</a> in 2025 were in plugins. Shop platforms: <a href="https://www.helpnetsecurity.com/?p=346060" target="_blank" rel="noopener">Magento stores</a> were attacked weeks after a fix existed.'],
['What happens to PHP versions that no longer get updates?','The PHP project patches only supported branches. For PHP2Shell, official releases covered 8.2 to 8.5, source-only patches were published for 7.4, 8.0 and 8.1, and <a href="https://endoflife.ai/article-php2shell-cve-2026-109618" target="_blank" rel="noopener">nothing was issued for 7.3 and older</a>. Some Linux distributions and paid support vendors backport fixes, so a <a href="https://notebookcheck.net/PHP2Shell-leaves-millions-of-servers-on-PHP-versions-with-no-official-fix.1433676.0.html" target="_blank" rel="noopener">version number alone can mislead</a>. That is why we check the actual build, not just the label.'],
['How quickly do attackers move once a flaw is public?','Often within hours. Patchstack measured a <a href="https://patchstack.com/whitepaper/state-of-wordpress-security-in-2026/" target="_blank" rel="noopener">median of five hours</a> to mass exploitation for heavily targeted WordPress flaws, and Amazon reported seeing PHP2Shell attempts about a week <em style="font-style:normal">before</em> patches were released. A yearly update is not enough, which is why monitoring and ongoing maintenance matter.']],

const countUp=el=>{if(!el.dataset.to||rm)return;const to=+el.dataset.to,suf=el.dataset.suf||'',t0=performance.now(),d=1300;const f=t=>{const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-k,3)))+suf;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)};
nc.forEach(c=>{const m=c.querySelector('.nm');m.addEventListener('pointermove',e=>{const r=m.getBoundingClientRect();m.style.setProperty('--mx',(e.clientX-r.left)+'px');m.style.setProperty('--my',(e.clientY-r.top)+'px')})});
if(!rm&&'IntersectionObserver' in window){nc.forEach(c=>c.classList.add('pre'));const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const c=e.target;c.classList.remove('pre');c.querySelectorAll('.cv').forEach(countUp);io.unobserve(c)}),{threshold:.45});nc.forEach(c=>io.observe(c))}
/* ===== GSAP ===== */
if(window.gsap&&window.ScrollTrigger&&!rm){try{
gsap.registerPlugin(ScrollTrigger);
if(window.Lenis){ls=new Lenis();ls.on('scroll',ScrollTrigger.update);gsap.ticker.add(t=>ls.raf(t*1000));gsap.ticker.lagSmoothing(0)}
gsap.timeline({defaults:{ease:'power3.out'}}).from('.lg',{y:-20,opacity:0,duration:.7}).from('.nl a,.nr>*',{y:-16,opacity:0,stagger:.07,duration:.6},'-=.4')
 .from('.h1 .line>span',{yPercent:115,duration:1.1,stagger:.12,ease:'power4.out'},'-=.3').from('.hp',{y:24,opacity:0,duration:.8},'-=.6').from('.cta .btn',{y:24,opacity:0,stagger:.1,duration:.7},'-=.5').from('.ill-h',{y:30,opacity:0,scale:.9,duration:1,ease:'back.out(1.4)'},'-=1.1');
const hs={trigger:'#top',start:'top top',end:'bottom top',scrub:true};


$$('[data-ln]:not(.h1)').forEach(h=>gsap.from(h.querySelectorAll('.line>span'),{yPercent:115,duration:1,stagger:.1,ease:'power4.out',scrollTrigger:{trigger:h,start:'top 85%'}}));
$$('[data-r]').forEach(el=>gsap.from(el,{y:36,opacity:0,duration:.9,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 90%'}}));
gsap.from('.w1>span',{yPercent:115,duration:.9,stagger:.045,ease:'power3.out',scrollTrigger:{trigger:'.sw',start:'top 80%'}});
$$('.orb').forEach(o=>gsap.to(o,{yPercent:-25,ease:'none',scrollTrigger:{trigger:o.parentElement,scrub:true}}));
$$('.cd').forEach((c,i)=>gsap.from(c,{x:i%2?70:-70,y:50,opacity:0,duration:1,ease:'power3.out',scrollTrigger:{trigger:c,start:'top 90%'}}));
gsap.from('.fb',{y:40,opacity:0,stagger:.15,duration:.9,ease:'power3.out',scrollTrigger:{trigger:'.fb',start:'top 85%'}});
gsap.from('.pc',{y:60,opacity:0,stagger:.12,duration:.9,ease:'power3.out',scrollTrigger:{trigger:'.pg',start:'top 85%'}});
gsap.from('.tc',{x:80,opacity:0,stagger:.12,duration:.9,ease:'power3.out',scrollTrigger:{trigger:'#tt',start:'top 85%'}});
gsap.to('.fin .btn.big',{scale:1.04,repeat:-1,yoyo:true,duration:1.6,ease:'sine.inOut'});
const mm=gsap.matchMedia();
mm.add('(min-width:900px)',()=>{
 const tr=$('.tr'),pw=$('.pw'),pjs=$$('.pj'),dist=()=>tr.scrollWidth-innerWidth;let cur=0;
 const tw=gsap.to(tr,{x:()=>-dist(),ease:'none',scrollTrigger:{trigger:pw,start:'top top',end:()=>'+='+dist(),pin:true,scrub:.6,anticipatePin:1,invalidateOnRefresh:true,
  onUpdate:s=>{const i=Math.round(s.progress*(pjs.length-1));if(i!==cur){cur=i;gsap.to(pw,{backgroundColor:C.work[i].bg,duration:.8})}}}});
 pjs.forEach(p=>{const c={containerAnimation:tw,trigger:p,scrub:true,ease:'none'};
  gsap.fromTo(p,{scale:.86,opacity:.35},{scale:1,opacity:1,ease:'none',scrollTrigger:{...c,start:'left 95%',end:'left 55%'}});
  gsap.fromTo(p.querySelector('.ph'),{x:60},{x:-80,ease:'none',scrollTrigger:{...c,start:'left right',end:'right left'}});
  gsap.fromTo(p.querySelector('.pi'),{x:90},{x:-30,ease:'none',scrollTrigger:{...c,start:'left right',end:'right left'}})});
 const lis=$$('.pl li'),sts=$$('.st'),line=$('.pl ol i');let cp=-1;
 const set=i=>{if(i===cp)return;cp=i;lis.forEach((l,k)=>l.classList.toggle('on',k===i));sts.forEach((s,k)=>s.classList.toggle('on',k===i))};set(0);
 ScrollTrigger.create({trigger:'#process',start:'top top',end:'+=250%',pin:true,onUpdate:s=>{set(Math.min(3,Math.floor(s.progress*4)));gsap.set(line,{scaleY:Math.min(1,s.progress*4/3)})}});
 if(matchMedia('(hover:hover)').matches)$$('.mag').forEach(b=>{const x=gsap.quickTo(b,'x',{duration:.4,ease:'power3'}),y=gsap.quickTo(b,'y',{duration:.4,ease:'power3'});
  b.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect();x((e.clientX-r.left-r.width/2)*.18);y((e.clientY-r.top-r.height/2)*.18)});b.addEventListener('pointerleave',()=>{x(0);y(0)})});
});
mm.add('(max-width:899px)',()=>{$$('.pj .mw').forEach(m=>gsap.from(m,{clipPath:'inset(0 0 100% 0)',duration:1,ease:'power3.out',scrollTrigger:{trigger:m,start:'top 85%'}}))});
document.fonts&&document.fonts.ready.then(refresh);addEventListener('load',refresh);
}catch(err){console.error(err)}}
</script></body></html>
